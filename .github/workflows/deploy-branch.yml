name: Deploy Branch
# Dispatched by detect-version.yml after it has tagged X.X.X and published the GitHub
# release from CHANGELOG.md (dan-release-standard 3). This workflow does one thing:
# cut the `version/X.X.X` branch, which the repos vendoring this one pin as their
# submodule branch (`branch = version/X.X.X` in their `.gitmodules`).
#
# It no longer creates the release. detect-version.yml already has, and a second
# ncipollo run against the same tag fails `already_exists`.

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: Version for this release. Format "X.X.X".

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release branch
        uses: peterjgrainger/action-create-branch@v2.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: version/${{ github.event.inputs.version }}
